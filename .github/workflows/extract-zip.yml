name: Extract zip update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip over repo
        run: |
          set -e
          ls -la
          unzip -l book-reader-v2.zip
          mkdir -p /tmp/extracted
          unzip -o -q book-reader-v2.zip -d /tmp/extracted
          echo "Extracted top-level:"
          ls -la /tmp/extracted
          if [ "$(ls -1 /tmp/extracted | wc -l)" -eq 1 ] && [ -d "/tmp/extracted/$(ls -1 /tmp/extracted)" ]; then
            SRC="/tmp/extracted/$(ls -1 /tmp/extracted)"
          else
            SRC="/tmp/extracted"
          fi
          echo "Copying from $SRC"
          cp -a "$SRC"/. .
          rm -f book-reader-v2.zip
          rm -f .github/workflows/extract-zip.yml
          echo "Changed files:"
          git status --short
      - name: Commit and push extracted files
        run: |
          set -e
          git config user.name "Amusu781"
          git config user.email "Amusu781@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update book-reader: layout crash fix in bookshelf and add library crash test"
          git push
