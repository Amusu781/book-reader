name: Extract v2 project archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract v2 archive into the repo
        run: |
          set -e
          test -f book-reader-v2.zip
          unzip -o book-reader-v2.zip
          rm -f book-reader-v2.zip
          rm -f android/local.properties
          git checkout -- .github/workflows/build-apk.yml || true
          rm -f .github/workflows/extract-v2.yml
          git config user.name "Amusu781"
          git config user.email "amusu781@users.noreply.github.com"
          git status --short
          git add -A
          echo "--- staged ---"
          git status --short
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update book-reader to v2"
            git push
          fi
